apiVersion: v1alpha1
name: okdp-control-plane-server
tag: 0.8.0-cnx01
protected: false
description: |
  OKDP Server - API backend for the Open Kubernetes Data Platform
usage:
  text: |
    The API is not exposed on its own host: the console routes /api to it, so
    the browser stays same-origin. Reach it at
    https://{{ .Parameters.consoleHost | default (printf "okdp-ui.%s" .Context.platform.ingress.suffix) }}/api
schema:
  parameters:
    properties:
      imageRepository: { type: string, default: "ghcr.io/kubotal/images/okdp-control-plane-server", description: "Server image repository." }
      imageTag: { type: string, default: "0.8.0", description: "Server image tag. Not empty on purpose: empty resolves to the chart appVersion, which lags the published images." }
      consoleHost: { type: string, description: "Console host, used verbatim as the single allowed origin. Defaults to okdp-ui.<ingress suffix>." }
      contextName: { type: string, default: "okdp-control-plane", description: "Context holding the service catalog of the Control Plane. Read by the server, referenced by no Release." }
      contextNamespace: { type: string, default: "kubocd-system" }
      platformContextName: { type: string, default: "platform", description: "Context the package templates also read. Empty means the same object as contextName." }
      platformContextNamespace: { type: string, default: "kubocd-system" }
      kubocdNamespace: { type: string, default: "kubocd-system" }
      logLevel: { type: string, default: "info", enum: [debug, info, warn, error] }
      releaseInterval: { type: string, default: "30m" }
      releaseTimeout: { type: string, default: "10m" }
      insecureOciRegistries: { type: string, default: "", description: "Registry hosts reachable over plain HTTP, comma separated. A sandbox concern, empty anywhere else." }
  context:
    properties:
      platform:
        required: true
        properties:
          ingress:
            required: true
            properties:
              suffix: { type: string, required: true }
modules:
  - name: main
    timeout: 10m
    source:
      oci:
        repository: ghcr.io/kubotal/charts/okdp-control-plane-server
        tag: 0.8.0
    values: |
      {{- $domain := printf "%v" .Context.platform.ingress.suffix -}}
      {{- $console := .Parameters.consoleHost | default (printf "okdp-ui.%s" $domain) -}}

      image:
        repository: {{ .Parameters.imageRepository | quote }}
        tag: {{ .Parameters.imageTag | quote }}

      configuration:
        platformNamespace: {{ .Release.spec.targetNamespace | quote }}
        kubocdNamespace: {{ .Parameters.kubocdNamespace | quote }}
        contextName: {{ .Parameters.contextName | quote }}
        contextNamespace: {{ .Parameters.contextNamespace | quote }}
        platformContextName: {{ .Parameters.platformContextName | quote }}
        platformContextNamespace: {{ .Parameters.platformContextNamespace | quote }}
        allowedOrigins: {{ printf "https://%s" $console | quote }}
        logLevel: {{ .Parameters.logLevel | quote }}
        releaseInterval: {{ .Parameters.releaseInterval | quote }}
        releaseTimeout: {{ .Parameters.releaseTimeout | quote }}
        insecureOciRegistries: {{ .Parameters.insecureOciRegistries | quote }}
roles:
  - okdp-server
dependencies:
  - ingress
