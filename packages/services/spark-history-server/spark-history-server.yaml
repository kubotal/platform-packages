# Consumes one s3 Connection (storage); s3SecretRef and oidcClientSecretRef
# name this instance's own identities.
apiVersion: v1alpha1
name: spark-history-server
tag: 3.5.1-cnx06
protected: false
description: |
  Spark History Server - Monitoring and debugging interface for Apache Spark applications.
  Provides detailed execution metrics, job timelines, and performance insights for completed Spark jobs.
  Essential tool for optimizing Spark workloads and troubleshooting data processing pipelines.
usage:
  text: |
    Spark History Server provides a web UI for viewing completed Spark applications.
    {{- if .Parameters.enableWebProxy }}
    Access the UI at https://{{ .Parameters.webProxyUrlPrefix }}-{{ .Release.spec.targetNamespace }}.{{ .Context.ingress.suffix }}
    {{- else }}
    Access the UI at https://spark-history-{{ .Release.spec.targetNamespace }}.{{ .Context.ingress.suffix }}
    {{- end }}
schema:
  parameters:
    properties:
      enableWebProxy: { type: boolean, default: true, title: "Cluster | Enable web proxy | | order:1", description: "Whether to enable Spark History web proxy" }
      resourceCpu: { type: string, default: "500m", title: "Resources | CPU limit | | order:2 columns:2 advanced:true placeholder:\"e.g. 500m, 1\"" }
      resourceMemory: { type: string, default: "1Gi", title: "Resources | Memory limit | | order:1 columns:2 advanced:true placeholder:\"e.g. 1Gi, 2Gi\"" }
      webProxyUrlPrefix: { title: "Cluster | Web proxy URL prefix | | order:2 advanced:true condition:enableWebProxy=true", type: string, default: "spark-web-proxy", description: "Spark web proxy url prefix" }
      storage: { title: "Storage | Event log store | | order:1", type: connectionRef, contract: s3, required: true, description: "Connection to the S3-compatible object store holding the Spark event logs." }
      s3SecretRef: { title: "Storage | S3 credentials secret | | order:2", type: string, required: true, description: "Secret with keys accessKey/secretKey, this consumer's own S3 identity." }
      oidcClientSecretRef: { title: "Authentication | OIDC client secret | | order:1", type: string, required: true, description: "OAuth client of this instance. Secret with keys: client_id, client_secret." }
      oidcScope: { title: "Authentication | Scopes | | order:2 advanced:true", type: string, default: "openid+profile+email+offline_access+groups", description: "Scopes requested on the OAuth2 login flow." }
      oidcUsePKCE: { title: "Authentication | Use PKCE | | order:3 advanced:true", type: boolean, default: true, description: "Whether to use PKCE on the OAuth2 login flow." }
      roleMapping:
        title: "Authentication | Role mapping | | order:4 advanced:true"
        description: "OIDC group to Spark ACL mapping (keys admin_groups, history_admin_groups, modify_groups, view_groups)."
        properties:
          admin_groups: { type: array, items: { type: string } }
          history_admin_groups: { type: array, items: { type: string } }
          modify_groups: { type: array, items: { type: string } }
          view_groups: { type: array, items: { type: string } }
      config:
        title: "Cluster | Extra Spark config | | order:3 advanced:true"
        type: object
        additionalProperties: true
        properties: {}
        description: "Spark History Server configuration entries merged as-is (e.g. spark.history.fs.logDirectory, cleaner, s3a and ui filter settings)."
  context:
    properties:
      certificateIssuers:
        required: true
        properties:
          selfSigned:
            properties:
              name: { type: string, required: true }
      ingress:
        required: true
        properties:
          suffix: { type: string, required: true }
      oidc:
        required: true
        properties:
          issuerUri: { type: string, required: true }
modules:
  - name: main
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/spark-history-server
        tag: 1.0.0
    values: |
      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $domain := printf "%v" .Context.ingress.suffix -}}

      {{- $oidcIssuerUri := .Context.oidc.issuerUri -}}
      {{- $oidcRoleMapping := .Parameters.roleMapping | default dict -}}
      {{- if not (kindIs "map" $oidcRoleMapping) }}
        {{- fail "parameters.roleMapping must be a map" -}}
      {{- end }}
      {{- $adminGroups := get $oidcRoleMapping "admin_groups" | default list -}}
      {{- $historyAdminGroups := get $oidcRoleMapping "history_admin_groups" | default list -}}
      {{- $modifyGroups := get $oidcRoleMapping "modify_groups" | default list -}}
      {{- $viewGroups := get $oidcRoleMapping "view_groups" | default list -}}

      {{- $storageApiUrl := .Parameters.storage.internalUrl | default .Parameters.storage.apiUrl -}}

      {{- $historyEndpointUrl := printf "https://spark-history-%s.%s" $namespace $domain -}}
      {{- $historyEndpointHost := printf "spark-history-%s.%s" $namespace $domain -}}

      {{- $webProxyEndpointUrl := printf "https://%s-%s.%s" .Parameters.webProxyUrlPrefix $namespace $domain -}}

      {{- $historyRedirectUri := $historyEndpointUrl -}}

      {{- if .Parameters.enableWebProxy }}
      {{- $historyRedirectUri := $webProxyEndpointUrl -}}
      {{- end }}
      {{- $sparkHistoryExtraConfig := (.Parameters.config | default dict) -}}
      {{- if not (kindIs "map" $sparkHistoryExtraConfig) }}
        {{- fail "parameters.config must be a map" -}}
      {{- end }}

      image:
        repository: quay.io/okdp/spark
        pullPolicy: IfNotPresent
        tag: "spark-3.5.6-scala-2.12-java-17"

      resources:
        limits:
          cpu: "{{ .Parameters.resourceCpu }}"
          memory: "{{ .Parameters.resourceMemory }}"
        requests:
          cpu: "250m"
          memory: "512Mi"

      ingress:
        enabled: true
        ingressClassName: "nginx"
        annotations:
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
          cert-manager.io/cluster-issuer: {{ .Context.certificateIssuers.selfSigned.name }}
        hosts:
          - host: {{ $historyEndpointHost }}
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - {{ $historyEndpointHost }}
            secretName: {{ .Release.metadata.name }}-tls

      config:
        spark.hadoop.fs.s3a.endpoint: {{ $storageApiUrl }}
        spark.hadoop.fs.s3a.path.style.access: {{ .Parameters.storage.pathStyle | default false }}
        spark.io.okdp.spark.authc.OidcAuthFilter.param.issuer-uri: {{ $oidcIssuerUri }}
        spark.io.okdp.spark.authc.OidcAuthFilter.param.redirect-uri: {{ $historyRedirectUri }}/home
        spark.io.okdp.spark.authc.OidcAuthFilter.param.scope: {{ .Parameters.oidcScope }}
        spark.io.okdp.spark.authc.OidcAuthFilter.param.cookie-max-age-minutes: 480
        spark.io.okdp.spark.authc.OidcAuthFilter.param.cookie-cipher-secret-key: FC5E81345CED0E256DC42E410362FF6E
        spark.io.okdp.spark.authc.OidcAuthFilter.param.cookie-is-secure: true
        spark.io.okdp.spark.authc.OidcAuthFilter.param.use-pkce: {{ .Parameters.oidcUsePKCE }}
      {{- if gt (len $adminGroups) 0 }}
        # spark.admin.acls.groups
        spark.admin.acls.groups: {{ $adminGroups | join "," | quote }}
      {{- end }}
      {{- if gt (len $historyAdminGroups) 0 }}
        # spark.history.ui.admin.acls.groups
        spark.history.ui.admin.acls.groups: {{ $historyAdminGroups | join "," | quote }}
      {{- end }}
      {{- if gt (len $modifyGroups) 0 }}
        # spark.modify.acls.groups
        spark.modify.acls.groups: {{ $modifyGroups | join "," | quote }}
      {{- end }}
      {{- if gt (len $viewGroups) 0 }}
        # spark.ui.view.acls.groups
        spark.ui.view.acls.groups: {{ $viewGroups | join "," | quote }}
      {{- end }}
      {{- range $key := (keys $sparkHistoryExtraConfig | sortAlpha) }}
        {{ $key }}: {{ index $sparkHistoryExtraConfig $key }}
      {{- end }}
      extraEnvs:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Parameters.s3SecretRef }}
              key: accessKey
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Parameters.s3SecretRef }}
              key: secretKey
        # Disable Certificate Checking
        - name: SPARK_HISTORY_OPTS
          value: "-Dcom.amazonaws.sdk.disableCertChecking=true"
        - name: JAVA_TOOL_OPTIONS
          value: "-Djavax.net.ssl.trustStore=/cacerts/bundle.p12 -Djavax.net.ssl.trustStorePassword="
        - name: AUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Parameters.oidcClientSecretRef }}
              key: client_id
        - name: AUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Parameters.oidcClientSecretRef }}
              key: client_secret

      extraVolumes:
        - name: cacerts
          secret:
            secretName: certs-bundle

      extraVolumeMounts:
        - name: cacerts
          mountPath: /cacerts
  # TODO: Kubocd — Add conditional modules
  - name: proxy
    dependsOn:
      - main
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/spark-web-proxy
        tag: 0.1.0
    values: |

      {{- $webProxyEndpointHost := printf "%s-%s.%s" .Parameters.webProxyUrlPrefix .Release.spec.targetNamespace .Context.ingress.suffix -}}

      image:
        repository: quay.io/okdp/spark-web-proxy
        pullPolicy: IfNotPresent
        tag: "0.2.1"

      configuration:
        spark:
          history:
            service: {{ .Release.metadata.name }}-main.{{ .Release.spec.targetNamespace }}.svc.cluster.local
          ui:
            proxyBase: /sparkui
          jobNamespaces:
            - {{ .Release.spec.targetNamespace }}

      ingress:
        enabled: true
        className: "nginx"
        annotations:
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
          cert-manager.io/cluster-issuer: {{ .Context.certificateIssuers.selfSigned.name }}
        hosts:
          - host: {{ $webProxyEndpointHost }}
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - {{ $webProxyEndpointHost }}
            secretName: {{ .Release.metadata.name }}-proxy-tls
roles:
  - spark
dependencies:
  - identity
  - storage
  - ingress
