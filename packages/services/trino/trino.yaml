# Connections wiring: the hive metastore and the S3 backend are connectionRef
# parameters (values read flat), the S3 identity is a per-consumer s3SecretRef
# parameter, and the OIDC provider is a platform context variable. One trino
# Connection is output per instance (kcd-<release>-endpoint).
apiVersion: v1alpha1
name: trino
#tag: 480-p01
# Currently, the UI requires the version to conform to SemVer (https://simversion.github.io/)
# https://github.com/OKDP/okdp-ui/blob/main/src/app/shared/utils/utils.ts#L131
tag: 480.0.0-p09
protected: false
description: |
  Apache Trino - Distributed SQL query engine designed for large-scale data processing across multiple data sources.
  High-performance, in-memory query engine that enables fast, interactive analytics on diverse data systems.
  Supports querying data from multiple databases, data warehouses, and big data platforms in a single query.
usage:
  text: |
    Apache Trino provides distributed SQL query engine designed for large-scale data processing.
    Access the UI at https://trino-{{ .Release.spec.targetNamespace }}.{{ .Context.platform.ingress.suffix }}
schema:
  parameters:
    properties:
      metastore: { type: connectionRef, connectionType: hive, required: true, description: "Hive metastore connection backing the hive catalog." }
      storage: { type: connectionRef, connectionType: s3, required: true, description: "S3 object store connection backing the hive catalog." }
      s3SecretRef: { type: string, required: true, description: "This instance's own S3 identity. Secret with keys: accessKey, secretKey." }
      oidcClientSecretRef: { type: string, required: true, description: "OAuth client of this instance. Secret with keys: client_id, client_secret. Ignored when enableDCR is true." }
      sharedSecretRef: { type: string, required: true, description: "Trino internal communication shared secret. Secret with key: shared-secret." }
      oidcScope: { type: string, default: "openid profile email groups", description: "Scopes requested on the OAuth2 login flow." }
      hiveCatalog: { type: string, default: hive, description: "Name of the hive catalog." }
      icebergCatalog: { type: connectionRef, connectionType: iceberg-catalog, description: "Iceberg REST catalog (Polaris) exposed as a second catalog. Omit to run with the hive catalog only." }
      icebergCatalogName: { type: string, default: iceberg, description: "Name of the iceberg catalog." }
      icebergWarehouse: { type: string, description: "Polaris catalog used as the Iceberg warehouse. Defaults to the realm published on the connection." }
      allowAuthOverHttp: { type: boolean, default: false, description: "Accept authenticated calls over plain HTTP. Needed by in-cluster clients that reach the coordinator service directly, such as Superset." }
      icebergOauth2Scope: { type: string, default: "PRINCIPAL_ROLE:ALL", description: "OAuth2 scope requested against the Iceberg REST catalog. Polaris rejects the connector default." }
      icebergOidcSecretRef: { type: string, description: "OAuth client Trino uses against the Iceberg REST catalog. Secret with keys: client_id, client_secret. Required when icebergCatalog is set." }
      numWorkers: { type: integer, default: 1, title: "Cluster | Workers | stepper | order:1 columns:2", description: "Number of workers" }
      workerMemoryGi: { type: number, default: 2, multipleOf: 0.25, title: "Cluster | Worker memory (GiB) | | order:3 columns:2", description: "Worker memory (GiB) used for Kubernetes requests/limits (recommended: request=limit)." }
      workerCpu: { type: number, default: 0.5, multipleOf: 0.25, title: "Cluster | Worker CPU (vCPU) | | order:2 columns:2", description: "Worker CPU request in millicores (e.g., 500=0.5 vCPU, 1000=1 vCPU)." }
      # Repris de l'ancien package: seul le dimensionnement des workers avait
      # survecu a la reecriture, le coordinateur restait fige en dur.
      coordinatorMemory: { type: string, default: "8Gi", title: "Cluster | Coordinator memory | | order:4 columns:2 advanced:true placeholder:\"e.g. 2Gi, 8Gi\"" }
      enableOPA: { type: boolean, default: true, description: "Whether to enable OPA." }
      enableOPAL: { type: boolean, default: false, description: "Whether to enable OPAL. When false, OPA policies are loaded from labeled ConfigMaps by the kube-mgmt sidecar." }
      enableOPADebugLogs: { type: boolean, default: false, description: "Log OPA status and decision logs to the container console. Verbose, intended for debugging." }
      policyRepoUrl: { type: string, default: "https://github.com/OKDP/okdp-examples.git", description: "OPA policy repo URL" }
      policyRepoMainBranch: { type: string, default: "main", description: "OPA policy repo branch." }
      OPAL_POLICY_SUBSCRIPTION_DIRS: {type: string, default: "trino_opa_policy", description: "Policy directories in the repository for which the client will subscribe to, seperated by ':'."}
      OPAL_POLICY_REPO_MANIFEST_PATH: { type: string, default: "trino_opa_policy", description: "The location of the manifest file in the remote repository."}
      opaPolicyPath: {type: string, default: "v1/data/trino/allow", description: "Path of the OPA policies for Trino used in the Trino variable opa.policy.uri."}
      defaultclientScopes: { type: string, default: "web-origins acr roles profile groups basic email", description: "Default Trino client's clientScopes" }
      optionalClientScopes: { type: string, default: "address phone organization offline_access microprofile-jwt", description: "Optional Trino client's clientScopes" }
      enableDCR: { type: boolean, default: false, description: "Whether to enable Dynamic Client Registration" }
  context:
    properties:
      platform:
        required: true
        properties:
          certificateIssuers:
            required: true
            properties:
              selfSigned:
                properties:
                  name: { type: string, required: true }
          ingress:
            required: true
            properties:
              suffix: { type: string, required: true }
          oidc:
            required: true
            properties:
              issuerUri: { type: string, required: true }
              authUrl: { type: string, required: true }
              tokenUrl: { type: string, required: true }
              jwksUri: { type: string, required: true }

modules:
  - name: opa
    enabled: "{{ .Parameters.enableOPA }}"
    timeout: 10m
    source:
      helmRepository:
        url: https://open-policy-agent.github.io/kube-mgmt/charts
        chart: opa-kube-mgmt
        version: 11.0.7
    values: |
      fullnameOverride: {{ .Release.metadata.name }}-opa
      authz:
        enabled: false
      image:
        repository: openpolicyagent/opa
        tag: 1.16.1
        pullPolicy: IfNotPresent
      useHttps: false
      port: 8181
      {{- if .Parameters.enableOPADebugLogs }}
      extraArgs:
        - "--set=status.console=true"
        - "--set=decision_logs.console=true"
      {{- end }}
      mgmt:
        enabled: {{ not .Parameters.enableOPAL }}
        startupProbe:
          failureThreshold: 5
          httpGet:
            path: /health
            port: 8181
            scheme: HTTP
          initialDelaySeconds: 20
          successThreshold: 1
          timeoutSeconds: 10
        data:
          enabled: true
        policies:
          enabled: true
      rbac:
        create: {{ not .Parameters.enableOPAL }}
      serviceAccount:
        create: {{ not .Parameters.enableOPAL }}

  - name: opal-secrets
    enabled: "{{ and .Parameters.enableOPA .Parameters.enableOPAL }}"
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/opal-secrets
        tag: 0.1.1
    values: |
      fullnameOverride: {{ .Release.metadata.name }}-opal-secrets
  - name: opal
    enabled: "{{ and .Parameters.enableOPA .Parameters.enableOPAL }}"
    dependsOn:
      - opa
      - opal-secrets
    timeout: 10m
    source:
      helmRepository:
        url: https://permitio.github.io/opal-helm-chart
        chart: opal
        version: 0.0.30
    values: |
      image:
        client:
          registry: docker.io
          repository: permitio/opal-client-standalone
          tag: 0.9.4
        server:
          registry: docker.io
          repository: permitio/opal-server
          tag: 0.9.4

      client:
        extraEnv:
          OPAL_POLICY_STORE_URL: http://{{ .Release.metadata.name }}-opa.{{ .Release.spec.targetNamespace }}:8181
          OPAL_POLICY_SUBSCRIPTION_DIRS: "{{ .Parameters.OPAL_POLICY_SUBSCRIPTION_DIRS }}"
        secrets:
          - opal-client-token-secret

      server:
        policyRepoUrl: "{{ .Parameters.policyRepoUrl }}"
        policyRepoMainBranch: "{{ .Parameters.policyRepoMainBranch }}"
        secrets:
          - opal-ssh-secret
          - opal-master-token-secret

        extraEnv:
          OPAL_POLICY_REPO_MANIFEST_PATH: "{{ .Parameters.OPAL_POLICY_REPO_MANIFEST_PATH }}"
          {{- with .Context.platform.proxy }}
          {{- if or .httpProxy .httpsProxy .noProxy }}
          {{- with .httpProxy }}
          HTTP_PROXY: {{ . | quote }}
          {{- end }}
          {{- with .httpsProxy }}
          HTTPS_PROXY: {{ . | quote }}
          {{- end }}
          {{- with .noProxy }}
          NO_PROXY: {{ . | quote }}
          {{- end }}
          {{- end }}
          {{- end }}

  - name: oidc-dcr
    enabled: "{{ .Parameters.enableDCR }}"
    timeout: 10m
    source:
      oci:
        repository: quay.io/adaltas/oidc-dcr
        tag: 0.3.2
    values: |
      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $domain := printf "%v" .Context.platform.ingress.suffix -}}

      {{- $oidcIssuerUri := .Context.platform.oidc.issuerUri -}}

      ttl_seconds: 30
      registration_url: "{{ $oidcIssuerUri }}/clients-registrations/openid-connect/"
      request:
        application_type: web
        client_name: "{{ $release }}-{{ $namespace }}"
        redirect_uris:
          - "https://trino-{{ $namespace }}.{{ $domain }}/oauth2/callback"
        logo_uri: "https://landscape.cncf.io/logos/008125b82108f19aea6b0004ce5f255b72bab5b5e5c169a302d7bf845edb8e6b.svg"
        grant_types:
          - "authorization_code"
          - "client_credentials"
        scope: "{{ printf "%s %s" .Parameters.defaultclientScopes .Parameters.optionalClientScopes }}"
      tls:
        insecure: false
        certificate: "certs-bundle"
      secret: "{{ $release }}-{{ $namespace }}-dcr"
      mapping:
        use_default: false
        key_mapping:
          OIDC_CLIENT_ID: ".client_id"
          OIDC_CLIENT_SECRET: ".client_secret"
          OIDC_ISSUER_URL: "{{ $oidcIssuerUri }}"
          OIDC_SCOPES: "{{ printf "%d %o" .Parameters.defaultclientScopes .Parameters.optionalClientScopes | join " " }}"

  - name: main
    timeout: 10m
    source:
      helmRepository:
        url: https://trinodb.github.io/charts/
        chart: trino
        version: v1.42.1
    values: |

      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $domain := printf "%v" .Context.platform.ingress.suffix -}}

      {{- $oidcIssuerUri := .Context.platform.oidc.issuerUri -}}
      {{- $oidcAuthUrl := .Context.platform.oidc.authUrl -}}
      {{- $oidcTokenUrl := .Context.platform.oidc.tokenUrl -}}
      {{- $oidcJwksUrl := .Context.platform.oidc.jwksUri -}}

      {{- $oidcScopes := .Parameters.oidcScope | replace " " "," -}}

      {{- $trinoEndpoint := printf "trino-%s.%s" $namespace $domain -}}

      image:
        repository: trinodb/trino
        tag: 480

      catalogs:
        {{ .Parameters.hiveCatalog }}: |
          connector.name=hive
          hive.metastore.uri={{ .Parameters.metastore.thriftUri }}
          fs.native-s3.enabled=true
          s3.endpoint={{ .Parameters.storage.apiUrl }}
          s3.path-style-access=true
          s3.region={{ .Parameters.storage.region }}
          s3.aws-access-key=${ENV:S3_ACCESS_KEY}
          s3.aws-secret-key=${ENV:S3_SECRET_ACCESS}
        {{- if .Parameters.icebergCatalog }}
        {{ .Parameters.icebergCatalogName }}: |
          connector.name=iceberg
          iceberg.catalog.type=rest
          iceberg.rest-catalog.uri={{ .Parameters.icebergCatalog.internalUri | default .Parameters.icebergCatalog.uri }}
          iceberg.rest-catalog.warehouse={{ .Parameters.icebergWarehouse | default .Parameters.icebergCatalog.realm }}
          iceberg.rest-catalog.security=OAUTH2
          iceberg.rest-catalog.oauth2.credential=${ENV:ICEBERG_OAUTH_CREDENTIAL}
          iceberg.rest-catalog.oauth2.scope={{ .Parameters.icebergOauth2Scope }}
          iceberg.rest-catalog.oauth2.server-uri={{ .Parameters.icebergCatalog.internalUri | default .Parameters.icebergCatalog.uri }}/v1/oauth/tokens
          iceberg.rest-catalog.vended-credentials-enabled=false
          fs.native-s3.enabled=true
          s3.endpoint={{ .Parameters.storage.apiUrl }}
          s3.path-style-access=true
          s3.region={{ .Parameters.storage.region }}
          s3.aws-access-key=${ENV:S3_ACCESS_KEY}
          s3.aws-secret-key=${ENV:S3_SECRET_ACCESS}
        {{- end }}

      env:
        - name: TRINO_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              {{- if .Parameters.enableDCR }}
              name: {{ $release }}-{{ $namespace }}-dcr
              key: OIDC_CLIENT_ID
              {{- else }}
              name: {{ .Parameters.oidcClientSecretRef }}
              key: client_id
              {{- end }}

        - name: TRINO_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              {{- if .Parameters.enableDCR }}
              name: {{ $release }}-{{ $namespace }}-dcr
              key: OIDC_CLIENT_SECRET
              {{- else }}
              name: {{ .Parameters.oidcClientSecretRef }}
              key: client_secret
              {{- end }}

        {{- if .Parameters.icebergCatalog }}
        - name: ICEBERG_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ required "icebergOidcSecretRef is required when icebergCatalog is set" .Parameters.icebergOidcSecretRef }}
              key: client_id
        - name: ICEBERG_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Parameters.icebergOidcSecretRef }}
              key: client_secret
        # Kubernetes expands $(VAR) from variables declared earlier in this list.
        - name: ICEBERG_OAUTH_CREDENTIAL
          value: "$(ICEBERG_OAUTH_CLIENT_ID):$(ICEBERG_OAUTH_CLIENT_SECRET)"
        {{- end }}

        - name: TRINO_SHARED_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Parameters.sharedSecretRef }}
              key: shared-secret

        - name: TRUSTSTORE_PASSWORD
          value: ""

        # The s3 identity of THIS instance: an ordinary parameter naming its
        # credentials Secret.
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Parameters.s3SecretRef }}
              key: accessKey

        - name: S3_SECRET_ACCESS
          valueFrom:
            secretKeyRef:
              name: {{ .Parameters.s3SecretRef }}
              key: secretKey

      coordinator:
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "{{ .Parameters.coordinatorMemory }}"

        additionalVolumes:
          - name: cacerts
            secret:
              secretName: certs-bundle

        additionalVolumeMounts:
          - name: cacerts
            mountPath: /cacerts
            readOnly: true

        additionalJVMConfig:
          - "-Djavax.net.ssl.trustStore=/cacerts/bundle.p12"
          - "-Djavax.net.ssl.trustStorePassword=${ENV:TRUSTSTORE_PASSWORD}"

      worker:
        resources:
          requests:
            cpu: "{{ .Parameters.workerCpu }}"
            memory: "{{ .Parameters.workerMemoryGi }}Gi"
          limits:
            cpu: "{{ mulf (float64 .Parameters.workerCpu) 2 }}"
            memory: "{{ mulf (float64 .Parameters.workerMemoryGi) 2 }}Gi"

        additionalVolumes:
          - name: cacerts
            secret:
              secretName: certs-bundle

        additionalVolumeMounts:
          - name: cacerts
            mountPath: /cacerts
            readOnly: true

        additionalJVMConfig:
          - "-Djavax.net.ssl.trustStore=/cacerts/bundle.p12"
          - "-Djavax.net.ssl.trustStorePassword=${ENV:TRUSTSTORE_PASSWORD}"

      ingress:
        enabled: true
        className: nginx
        annotations:
          cert-manager.io/cluster-issuer: "{{ .Context.platform.certificateIssuers.selfSigned.name }}"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
          nginx.ingress.kubernetes.io/use-regex: "true"
        hosts:
          - host: {{ $trinoEndpoint }}
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - {{ $trinoEndpoint }}
            secretName: {{ .Release.metadata.name }}-tls

      server:
        workers: {{ .Parameters.numWorkers }}
        node:
          environment: sandbox
        config:
          authenticationType: "oauth2"
          coordinator: "true"
          node-scheduler.include-coordinator: "true"
          discovery-server.enabled: "true"
          path: /etc/trino
          https:
            enabled: false
        workerExtraConfig: ""
        coordinatorExtraConfig: |
          http-server.process-forwarded=true
          web-ui.authentication.type=oauth2
          # Enable two authentication flows on the coordinator:
          # - OAUTH2: interactive browser-based login for human users (UI/CLI with external authentication)
          # - JWT: non-interactive bearer token authentication for automation/service accounts
          #   such as scripts, jobs, or CI/CD using --access-token
          http-server.authentication.type=jwt,oauth2
          {{- if .Parameters.allowAuthOverHttp }}
          # In-cluster clients reach the coordinator on plain HTTP; without this
          # Trino answers 403 to any authenticated call that is not TLS.
          http-server.authentication.allow-insecure-over-http=true
          {{- end }}
          http-server.authentication.oauth2.issuer={{ $oidcIssuerUri }}
          http-server.authentication.oauth2.client-id=${ENV:TRINO_OAUTH_CLIENT_ID}
          http-server.authentication.oauth2.client-secret=${ENV:TRINO_OAUTH_CLIENT_SECRET}
          http-server.authentication.oauth2.auth-url={{ $oidcAuthUrl }}
          http-server.authentication.oauth2.token-url={{ $oidcTokenUrl }}
          http-server.authentication.oauth2.scopes={{ $oidcScopes }}
          http-server.authentication.oauth2.principal-field=preferred_username

          http-server.authentication.jwt.key-file={{ $oidcJwksUrl }}
          http-server.authentication.jwt.required-issuer={{ $oidcIssuerUri }}
          http-server.authentication.jwt.required-audience=account
          http-server.authentication.jwt.principal-field=client_id

      additionalConfigProperties:
        - internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}

      {{- if .Parameters.enableOPA }}
      accessControl:
        type: properties
        properties: |
          access-control.name=opa
          opa.policy.uri=http://{{ .Release.metadata.name }}-opa.{{ .Release.spec.targetNamespace }}:8181/{{ .Parameters.opaPolicyPath }}
          opa.log-responses=true
          opa.log-requests=true
      {{- end }}
outputs:
  # One trino Connection per instance, named 'kcd-<release>-endpoint'. Two
  # releases of this package = two distinct Connections.
  - name: endpoint
    connectionType: trino
    values:
      url: "https://trino-{{ .Release.spec.targetNamespace }}.{{ .Context.platform.ingress.suffix }}"
      uri: "trino://trino@trino-{{ .Release.spec.targetNamespace }}.{{ .Context.platform.ingress.suffix }}"
      internalUri: "trino://trino@{{ .Release.metadata.name }}-main-trino.{{ .Release.spec.targetNamespace }}.svc.cluster.local:8080"
      catalogs:
        - tpch
        - tpcds
        - "{{ .Parameters.hiveCatalog }}"
        - "{{ .Parameters.icebergCatalogName }}"
roles:
  - interactive-query
dependencies:
  - data-catalog
  - ingress
