# Connections wiring: the metadata and examples databases are connectionRef
# parameters (interface database-server), the OIDC provider is a platform
# context connection (interface oidc, OAuth clients stay ordinary Secret name
# parameters), and trino datasources are a list of per item connectionRefs.

apiVersion: v1alpha1
name: superset
tag: 6.0.0-cnx02
protected: false
description: |
  Apache Superset - Enterprise business intelligence platform for modern data teams.
  Self-service analytics tool that enables users to create interactive dashboards, explore datasets,
  and build data visualizations without coding. Integrates with popular databases and supports SQL Lab.
usage:
  text: |
    Apache Superset provides modern data visualization and exploration capabilities.
    Access the UI at https://superset-{{ .Release.spec.targetNamespace }}.{{ .Context.platform.ingress.suffix }}
schema:
  parameters:
    properties:
      load_examples: { type: boolean, default: true, description: "Whether to load superset examples" }
      # Superset metadata database
      metadataDb: { type: connectionRef, interface: database-server, required: true }
      # Database hosting the superset examples (used when load_examples is true)
      examplesDb: { type: connectionRef, interface: database-server, required: true }
      # Secret Key for Superset's Flask App. Secret with key: superset_secret_key
      secretKeyRef: { type: string, required: true }
      # External redis. Host defaults to the redis bundled by the chart
      redisHost: { type: string }
      redisPort: { type: integer, default: 6379 }
      # Secret with keys: username, password
      redisSecretRef: { type: string, required: true }
      # OAuth client of THIS instance. The provider comes from the platform context
      oidcEnabled: { type: boolean, default: true }
      oidcProvider: { type: string, default: keycloak, description: "Provider display name" }
      oidcScope: { type: string, default: "openid profile email groups" }
      oidcUsePKCE: { type: boolean, default: true }
      # Secret with keys: client_id, client_secret
      oidcClientSecretRef: { type: string, required: true }
      # Map of OIDC roles to lists of superset roles
      oidcRoleMapping: { type: object, properties: {}, additionalProperties: true }
      trinoOidcEnabled: { type: boolean, default: true }
      trinoOidcScope: { type: string, default: "openid profile email groups" }
      # Secret with keys: client_id, client_secret
      trinoOidcClientSecretRef: { type: string, required: true }
      # Datasources: one list, each element wires its own trino connection and
      # its catalog. The name is the display name in the Superset UI
      datasources:
        type: array
        items:
          properties:
            name: { type: string, required: true }
            trino: { type: connectionRef, interface: trino, required: true }
            catalog: { type: string, default: hive }
  context:
    properties:
      platform:
        required: true
        properties:
          oidc:
            required: true
            properties:
              issuerUri: { type: string, required: true }
          certificateIssuers:
            required: true
            properties:
              selfSigned:
                properties:
                  name: { type: string, required: true }
          ingress:
            required: true
            properties:
              suffix: { type: string, required: true }
modules:
  - name: main
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/superset
        tag: 0.15.2-2.0
    values: |

      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $release := printf "%v" .Release.metadata.name -}}
      {{- $domain := printf "%v" .Context.platform.ingress.suffix -}}

      {{- /* The examples loader is postgresql specific (psycopg2 dialect, main search_path) */ -}}
      {{- $examplesDatabaseJdbcUrl := printf "postgresql+psycopg2://$DB_EXAMPLES_USER:$DB_EXAMPLES_PASS@%s:%v/%s?options=-csearch_path%%3Dmain" .Parameters.examplesDb.host .Parameters.examplesDb.port .Parameters.examplesDb.dbName -}}

      {{- /* The oidc connection resolved from the platform context */ -}}
      {{- $oidcBaseUrl := printf "%s/protocol/openid-connect" .Context.platform.oidc.issuerUri -}}

      {{- $supersetOidcRoleMapping := .Parameters.oidcRoleMapping | default dict }}

      {{- $supersetHost := printf "superset-%s.%s" $namespace $domain -}}

      okdp:
        # Superset configuration
        superset:
          superset_secret_key: ~
          extra_config: &extra_config |
            from datetime import timedelta
            # Set up max age of session to 8 hours
            PERMANENT_SESSION_LIFETIME = timedelta(hours=8)
            # This will make sure the redirect_uri is properly computed, even with SSL offloading
            ENABLE_PROXY_FIX = True
            PROXY_FIX_CONFIG = {
              "x_for": 1,
              "x_proto": 1,
              "x_host": 1,
              "x_port": 1,
              "x_prefix": 1,
            }
          feature_flags: &feature_flags |
            # https://github.com/apache/superset/blob/master/RESOURCES/FEATURE_FLAGS.md
            FEATURE_FLAGS = {
              "DASHBOARD_RBAC": True,
              "EMBEDDED_SUPERSET": True,
              "EMBEDDABLE_CHARTS": True,
              "ENABLE_TEMPLATE_PROCESSING": True,
              "DASHBOARD_NATIVE_FILTERS": True,
              "DASHBOARD_CROSS_FILTERS": True,
            }
          load_examples:
            enabled: {{ .Parameters.load_examples }}
            jdbc_uri: {{ $examplesDatabaseJdbcUrl }}

        # Oauth2 configuration
        oauth:
          enabled: {{ .Parameters.oidcEnabled }}
          provider: "{{ .Parameters.oidcProvider }}"
          base_url: {{ $oidcBaseUrl }}
          scope: "{{ .Parameters.oidcScope }}"
          use_pkce: {{ .Parameters.oidcUsePKCE }}
          auth_registration: &auth_registration |
            AUTH_USER_REGISTRATION = True
            AUTH_ROLE_PUBLIC = "Public"
            AUTH_USER_REGISTRATION_ROLE = "Public"
            AUTH_ROLES_SYNC_AT_LOGIN = True
          oauth2_superset_roles_mapping: &oauth2_superset_roles_mapping |
            AUTH_ROLES_MAPPING = {
            {{- range $oidcRole, $supersetRoles := $supersetOidcRoleMapping }}
              {{ $oidcRole | quote }}: {{ $supersetRoles | toJson }},
            {{- end }}
            }

        trino:
          oauth:
            enabled: {{ .Parameters.trinoOidcEnabled }}
            base_url: {{ $oidcBaseUrl }}
            scope: "{{ .Parameters.trinoOidcScope }}"

      superset:
        image:
          repository: quay.io/okdp/superset
          tag: 6.0.0
          pullPolicy: IfNotPresent
        initImage:
          repository: quay.io/okdp/superset
          tag: 6.0.0-dockerize
          pullPolicy: IfNotPresent
        supersetWebsockets:
          image:
            repository: quay.io/okdp/superset
            tag: 6.0.0-websocket
            pullPolicy: IfNotPresent

        extraConfigs:
          import_datasources.yaml: |
            databases:
            {{- range .Parameters.datasources }}
              - database_name: {{ .name }}
                sqlalchemy_uri: "{{ .trino.internalUri }}/{{ .catalog }}"
                expose_in_sqllab: true
                tables: []
            {{- end }}
        postgresql:
          # Use an external database
          enabled: false
        # If no existing redis cache provided, enable to use the bitnami redis cache
        # The credentials should match 'superset.supersetNode.connections'
        redis:
          enabled: true
          architecture: standalone
          auth:
            ## Enable password authentication
            enabled: false
        extraEnvRaw:
          # Superset secret key
          - name: SUPERSET_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: {{ .Parameters.secretKeyRef }}
                key: superset_secret_key
          # Superset/DB credentials
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: {{ .Parameters.metadataDb.secretRef }}
                key: username
          - name: DB_PASS
            valueFrom:
              secretKeyRef:
                name: {{ .Parameters.metadataDb.secretRef }}
                key: password
          # Superset/Redis credentials
          - name: REDIS_USER
            valueFrom:
              secretKeyRef:
                name: {{ .Parameters.redisSecretRef }}
                key: username
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Parameters.redisSecretRef }}
                key: password
          # OIDC credentials
          - name: AUTH_OAUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: {{ .Parameters.oidcClientSecretRef }}
                key: client_id
          - name: AUTH_OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ .Parameters.oidcClientSecretRef }}
                key: client_secret
          # OIDC Trino credentials
          - name: TRINO_OAUTH_CLIENT_ID
            valueFrom:
              secretKeyRef:
                name: {{ .Parameters.trinoOidcClientSecretRef }}
                key: client_id
          - name: TRINO_OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ .Parameters.trinoOidcClientSecretRef }}
                key: client_secret
          # CA
          - name: REQUESTS_CA_BUNDLE
            value: /cacerts/ca.crt

          {{- if .Context.platform.proxy.httpProxy }}
          - name: HTTP_PROXY
            value: {{ .Context.platform.proxy.httpProxy | quote }}
          {{- end }}
          {{- if .Context.platform.proxy.httpsProxy }}
          - name: HTTPS_PROXY
            value: {{ .Context.platform.proxy.httpsProxy | quote }}
          {{- end }}
          {{- if .Context.platform.proxy.noProxy }}
          - name: NO_PROXY
            value: {{ .Context.platform.proxy.noProxy | quote }}
          {{- end }}
          # Examples
          {{- if .Parameters.load_examples }}
          - name: DB_EXAMPLES_HOST
            value: {{ .Parameters.examplesDb.host }}
          - name: DB_EXAMPLES_PORT
            value: "{{ .Parameters.examplesDb.port }}"
          - name: DB_EXAMPLES_NAME
            value: {{ .Parameters.examplesDb.dbName }}
          - name: DB_EXAMPLES_USER
            valueFrom:
              secretKeyRef:
                name: {{ .Parameters.examplesDb.secretRef }}
                key: username
          - name: DB_EXAMPLES_PASS
            valueFrom:
              secretKeyRef:
                name: {{ .Parameters.examplesDb.secretRef }}
                key: password
          {{- end }}
        supersetNode:
          # Connections to an existing database and cache
          connections:
            # -- PostgreSQL
            db_host: "{{ .Parameters.metadataDb.host }}"
            db_port: "{{ .Parameters.metadataDb.port }}"
            db_name: {{ .Parameters.metadataDb.dbName }}
            db_user: ~
            db_pass: ~
            # -- Redis
            redis_host: {{ default (printf "%s-main-redis-headless" $release) .Parameters.redisHost | quote }}
            redis_port: {{ .Parameters.redisPort }}
            redis_user: ~
            redis_password: ~
            redis_cache_db: "1"
            redis_celery_db: "0"
            redis_ssl:
              enabled: false
              ssl_cert_reqs: CERT_NONE

        ingress:
          enabled: true
          ingressClassName: "nginx"
          annotations:
            kubernetes.io/ingress.class: nginx
            cert-manager.io/cluster-issuer: {{ .Context.platform.certificateIssuers.selfSigned.name }}
            acme.cert-manager.io/http01-edit-in-place: "true"
            # kubernetes.io/tls-acme: "true"
            ## Extend timeout to allow long running queries.
            nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
            nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
            nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
            nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
          path: /
          pathType: ImplementationSpecific
          hosts:
            - {{ $supersetHost }}
          tls:
            - hosts:
                - {{ $supersetHost }}
              secretName: "{{ $release }}-tls-secret"

        configOverrides:
          auth_registration: *auth_registration
          oauth_to_superset_roles_mapping: *oauth2_superset_roles_mapping
          extra_config: *extra_config
          feature_flags: *feature_flags

        extraVolumes:
          - name: cacerts
            secret:
              secretName: certs-bundle

        extraVolumeMounts:
          - name: cacerts
            mountPath: /cacerts

roles:
  - dataviz
dependencies:
  - database-server
  - ingress
