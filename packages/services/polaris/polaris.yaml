# Connections wiring: consumes db (connection type database-server) and storage (connection type s3)
# as connectionRef parameters, plus the platform OIDC provider as the context variable
# platform.oidc. The S3 identity is the ordinary parameter s3SecretRef and
# the OAuth client is oidcClientSecretRef. Produces one iceberg-catalog Connection (output catalog).
apiVersion: v1alpha1
name: polaris
tag: 1.3.0-incubating-cnx02
protected: false
description: |
  Apache Polaris is an open-source, fully-featured catalog for Apache Iceberg™.
usage:
  text: |
    Apache Polaris is an open-source, fully-featured catalog for Apache Iceberg™.
    Access the UI at https://polaris-console-{{ .Release.spec.targetNamespace }}.{{ .Context.platform.ingress.suffix }}
schema:
  parameters:
    properties:
      purge: { type: boolean, default: false, description: "Whether to purge realms and all associated entities." }
      db: { type: connectionRef, connectionType: database-server, required: true, description: "Connection to the PostgreSQL server hosting the Polaris metastore database." }
      storage: { type: connectionRef, connectionType: s3, required: true, description: "Connection to the S3-compatible object store backing the catalogs." }
      s3SecretRef: { type: string, required: true, description: "Secret with keys accessKey/secretKey, this consumer's own S3 identity (STS and catalog-side Iceberg metadata operations)." }
      oidcClientSecretRef: { type: string, required: true, description: "Secret with keys client_id/client_secret, the OAuth client of this Polaris instance." }
      realms:
        type: array
        required: true
        description: "Realm definitions passed to the bootstrap, main and principals modules."
        items:
          properties:
            name: { type: string, required: true }
          additionalProperties: true
      defaultRealm: { type: string, required: true, description: "Realm published on the catalog Connection and preselected in the console." }
      console:
        properties:
          oidcClientId: { type: string, default: polaris-console, description: "Public OIDC client (PKCE) used by the console." }
          oidcScope: { type: string, default: "openid profile email roles offline_access", description: "OIDC scope requested by the console." }
  context:
    properties:
      platform:
        required: true
        properties:
          oidc:
            required: true
            properties:
              issuerUri: { type: string, required: true }
          certificateIssuers:
            required: true
            properties:
              selfSigned:
                properties:
                  name: { type: string, required: true }
          ingress:
            required: true
            properties:
              suffix: { type: string, required: true }
modules:
  - name: bootstrap
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/polaris-admin
        tag: 1.0.0
    values: |
      phase: "bootstrap"

      bootstrap:

        purge: {{ .Parameters.purge }}

        image:
          repository: apache/polaris-admin-tool
          tag: 1.3.0-incubating
          pullPolicy: IfNotPresent

        database:
          jdbcUrl: "jdbc:postgresql://{{ .Parameters.db.host }}:{{ .Parameters.db.port }}/{{ .Parameters.db.dbName }}"
          secret:
            name: {{ .Parameters.db.secretRef }}
            usernameKey: username
            passwordKey: password

      realms:
        {{- toYaml .Parameters.realms | nindent 2 }}

  - name: main
    dependsOn:
      - bootstrap
    timeout: 10m
    source:
      helmRepository:
        url: https://downloads.apache.org/incubator/polaris/helm-chart/
        chart: polaris
        version: 1.3.0-incubating
    values: |

      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $domain := printf "%v" .Context.platform.ingress.suffix -}}

      {{- $databaseJdbcUrl := printf "jdbc:postgresql://%v:%v/%v" .Parameters.db.host .Parameters.db.port .Parameters.db.dbName -}}

      {{- $oidcIssuerUri := .Context.platform.oidc.issuerUri -}}

      {{- $polarisEndpointAPIUrl := printf "https://polaris-%s.%s" $namespace $domain -}}
      {{- $polarisEndpointAPIHost := regexReplaceAll "^https?://" $polarisEndpointAPIUrl "" -}}

      {{- $storageApiUrl := .Parameters.storage.apiUrl -}}
      {{- $storageRegion := .Parameters.storage.region -}}

      image:
        repository: apache/polaris
        pullPolicy: IfNotPresent
        tag: "1.3.0-incubating"

      extraEnv:
        # S3
        - name: AWS_REGION
          value: {{ $storageRegion }}
        - name: AWS_ENDPOINT_URL_S3
          value: {{ $storageApiUrl }}
        - name: AWS_ENDPOINT_URL_STS
          value: {{ $storageApiUrl }}
        # The Polaris S3 identity for STS
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Parameters.s3SecretRef }}
              key: accessKey
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Parameters.s3SecretRef }}
              key: secretKey
        # Polaris Database
        - name: QUARKUS_DATASOURCE_JDBC_URL
          value: {{ $databaseJdbcUrl }}
        - name: QUARKUS_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Parameters.db.secretRef }}
              key: username
        - name: QUARKUS_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Parameters.db.secretRef }}
              key: password
        - name: QUARKUS_OIDC_TLS_CONFIGURATION_NAME
          value: "oidc"
        - name: QUARKUS_TLS__OIDC__TRUST_STORE_PEM_CERTS
          value: "/cacerts/ca.crt"
        # OIDC, Enable multi-tenancy (Multiple realms)
        - name: QUARKUS_OIDC_TENANT-ENABLED
          value: "true"
        - name: QUARKUS_OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Parameters.oidcClientSecretRef }}
              key: client_id
        # Trust The CA
        - name: JAVA_TOOL_OPTIONS
          value: >-
            -Djavax.net.ssl.trustStore=/cacerts/bundle.p12
            -Djavax.net.ssl.trustStoreType=PKCS12
            -Djavax.net.ssl.trustStorePassword=

      persistence:
        type: relational-jdbc

      features:
        DROP_WITH_PURGE_ENABLED: true
        # ENFORCE_PRINCIPAL_CREDENTIAL_ROTATION_REQUIRED_CHECKING: false
        SUPPORTED_CATALOG_STORAGE_TYPES:
          - S3
        realmOverrides: {}
        # my-realm:
        #   ENFORCE_PRINCIPAL_CREDENTIAL_ROTATION_REQUIRED_CHECKING: true

      realmContext:
        type: default
        realms:
        {{- range .Parameters.realms }}
          - {{ .name }}
        {{- end }}

      advancedConfig:
        polaris.realm-context.header-name: "Polaris-Realm"
        # Spark and Trino does not pass the header
        # polaris.realm-context.require-header: false
        quarkus.http.cors.enabled: "true"

      authentication:
        type: mixed

      oidc:
        authServeUrl: {{ $oidcIssuerUri }}
        client:
          id: ~
          secret:
            name: {{ .Parameters.oidcClientSecretRef }}
            key: client_secret

        # Map polaris internal principal and roles with OIDC principal and roles
        principalMapper:
          type: default
          # You can use 'sub' as stable and immutable identity
          idClaimPath: ~
          nameClaimPath: "preferred_username"
        # Mapped OIDC roles are visible, but they do not have the same effect as internal Polaris assignments.
        # Issue: https://github.com/apache/polaris/issues/2373
        # Polaris activates only the internal principal roles that are actually granted to that principal in Polaris RBAC
        # Active Polaris roles = (mapped external roles) ∩ (principal roles granted in Polaris)
        principalRolesMapper:
          type: default
          rolesClaimPath: realm_access/roles
          filter: "^(?!default-roles-.*|offline_access$|uma_authorization$).*$"
          mappings:
            # The rules are applied sequentially as ordered transforms
            # Strip the "polaris_" prefix from admin roles and convert them to Polaris roles:
            # polaris_service_admin -> PRINCIPAL_ROLE:service_admin
            # polaris_catalog_admin -> PRINCIPAL_ROLE:catalog_admin
            # platform_admin -> PRINCIPAL_ROLE:platform_admin
            - regex: "^polaris_(.*)$"
              replacement: "PRINCIPAL_ROLE:$1"
            # Fallback for normal roles, but do NOT touch values already prefixed by Polaris.
            - regex: "^(?!PRINCIPAL_ROLE:)(?!polaris_)(.*)$"
              replacement: "PRINCIPAL_ROLE:$1"

      logging:
        level: DEBUG

      cors:
        allowedOrigins:
          - "https://polaris-console-{{ $namespace }}.{{ $domain }}"
        allowedMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "PATCH"
          - "OPTIONS"
        allowedHeaders:
          - "Content-Type"
          - "Authorization"
          - "Polaris-Realm"
          - "X-Request-ID"
        exposedHeaders:
          - "*"
        accessControlMaxAge: "PT10M"
        accessControlAllowCredentials: true

      ingress:
        enabled: true
        className: "nginx"
        annotations:
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
          cert-manager.io/cluster-issuer: {{ .Context.platform.certificateIssuers.selfSigned.name }}
        hosts:
          - host: {{ $polarisEndpointAPIHost }}
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - {{ $polarisEndpointAPIHost }}
            secretName: {{ .Release.metadata.name }}-tls

      extraVolumes:
        - name: cacerts
          secret:
            secretName: certs-bundle

      extraVolumeMounts:
        - name: cacerts
          mountPath: /cacerts

  - name: principals
    dependsOn:
      - main
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/polaris-admin
        tag: 1.0.0
    values: |

      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $domain := printf "%v" .Context.platform.ingress.suffix -}}

      {{- $polarisEndpointAPIUrl := printf "https://polaris-%s.%s" $namespace $domain -}}

      phase: "principals"

      principals:

        image:
          repository: curlimages/curl
          tag: 8.18.0
          pullPolicy: IfNotPresent

        polaris:
          url: {{ $polarisEndpointAPIUrl }}

        caCertPath: /cacerts/ca.crt

      realms:
        {{- toYaml .Parameters.realms | nindent 2 }}

      extraVolumes:
        - name: cacerts
          secret:
            secretName: certs-bundle

      extraVolumeMounts:
        - name: cacerts
          mountPath: /cacerts

  - name: console
    dependsOn:
      - main
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/polaris-console
        tag: 0.1.0
    values: |

      {{- $namespace := printf "%v" .Release.spec.targetNamespace -}}
      {{- $domain := printf "%v" .Context.platform.ingress.suffix -}}

      {{- $oidcIssuerUri := .Context.platform.oidc.issuerUri -}}

      {{- $polarisEndpointAPIUrl := printf "https://polaris-%s.%s" $namespace $domain -}}

      {{- $polarisEndpointConsoleUrl := printf "https://polaris-console-%s.%s" $namespace $domain -}}
      {{- $polarisEndpointConsoleHost := regexReplaceAll "^https?://" $polarisEndpointConsoleUrl "" -}}

      image:
        repository: quay.io/okdp/polaris-console
        tag: v0.1.0
        pullPolicy: Always

      env:
        polarisApiUrl: "{{ $polarisEndpointAPIUrl }}"
        polarisRealm: "{{ .Parameters.defaultRealm }}"
        oauthTokenUrl: "{{ $polarisEndpointAPIUrl }}/api/catalog/v1/oauth/tokens"

      extraEnv:
        VITE_OIDC_ISSUER_URL: "{{ $oidcIssuerUri }}"
        VITE_OIDC_CLIENT_ID: "{{ .Parameters.console.oidcClientId }}"
        VITE_OIDC_REDIRECT_URI: "{{ $polarisEndpointConsoleUrl }}/auth/callback"
        VITE_OIDC_SCOPE: "{{ .Parameters.console.oidcScope }}"

      ingress:
        enabled: true
        className: "nginx"
        annotations:
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
          cert-manager.io/cluster-issuer: {{ .Context.platform.certificateIssuers.selfSigned.name }}
        hosts:
          - host: {{ $polarisEndpointConsoleHost }}
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: polaris-console-tls
            hosts:
              - {{ $polarisEndpointConsoleHost }}

outputs:
  - name: catalog
    connectionType: iceberg-catalog
    values:
      uri: "https://polaris-{{ .Release.spec.targetNamespace }}.{{ .Context.platform.ingress.suffix }}/api/catalog"
      realm: "{{ .Parameters.defaultRealm }}"
roles:
  - data-catalog
  - iceberg-catalog
dependencies:
  - identity
  - storage
  - database-server
  - ingress
