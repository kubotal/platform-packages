# Name of the OAuth client, and of the OidcClient CR. One per service instance.
clientName: ""
# Namespace kubauth watches for OidcClient resources.
oidcNamespace: ""
# Secret written next to the service, carrying the clear client id and secret.
credentialsSecretName: ""
clientIdKey: "client_id"
clientSecretKey: "client_secret"
redirectURIs: []
displayName: ""
description: ""
# Scopes requested by the client. The defaults are what the OKDP services need;
# a service asking for more declares them here.
scopes:
  - openid
  - profile
  - email
  - groups
  - offline_access

# Extra keys to generate in the credentials Secret, alongside the client id and
# secret. A service needing its own random key (JupyterHub's crypt key, say)
# lists it here rather than requiring a second Secret from somewhere else. Like
# the client secret, each is minted once and read back on later reconciles.
extraGeneratedKeys: []
