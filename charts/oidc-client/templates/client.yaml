{{/*
The client secret is generated here and must survive an upgrade: rotating it on
every reconcile would leave the service holding one secret and kubauth another,
and the users locked out until both settled. So it is read back from the Secret
already in place when there is one, and only minted when there is not.

The bcrypt hash is kept in an annotation for the same reason. bcrypt salts every
call, so re-hashing the same secret yields a different digest, which would make
every reconcile look like a change and restart the service for nothing.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.credentialsSecretName -}}
{{- $clientSecret := "" -}}
{{- $bcryptHash := "" -}}
{{- if and $existing $existing.data (index $existing.data .Values.clientSecretKey) -}}
  {{- $clientSecret = index $existing.data .Values.clientSecretKey | b64dec -}}
  {{- if and $existing.metadata $existing.metadata.annotations -}}
    {{- $bcryptHash = index $existing.metadata.annotations "kubauth.kubotal.io/hashed-secret" | default "" -}}
  {{- end -}}
{{- end -}}
{{- if not $clientSecret -}}
  {{- $clientSecret = randAlphaNum 64 -}}
{{- end -}}
{{- if not $bcryptHash -}}
  {{- $bcryptHash = bcrypt $clientSecret -}}
{{- end -}}
{{- $hashedSecretName := printf "%s-hashed" .Values.credentialsSecretName -}}
{{- if not .Values.oidcNamespace -}}
  {{- fail "oidcNamespace is required: it is the namespace kubauth watches for OidcClient resources" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.credentialsSecretName }}
  annotations:
    kubauth.kubotal.io/hashed-secret: {{ $bcryptHash | quote }}
type: Opaque
stringData:
  {{ .Values.clientIdKey }}: {{ .Values.clientName }}
  {{ .Values.clientSecretKey }}: {{ $clientSecret }}
  {{- range .Values.extraGeneratedKeys }}
  {{- $current := "" }}
  {{- if and $existing $existing.data (index $existing.data .) }}
  {{- $current = index $existing.data . | b64dec }}
  {{- end }}
  {{ . }}: {{ $current | default (randAlphaNum 64) }}
  {{- end }}
---
{{/* kubauth only ever sees the hash, never the secret itself. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $hashedSecretName }}
  namespace: {{ .Values.oidcNamespace }}
type: Opaque
stringData:
  hashedSecret: {{ $bcryptHash | quote }}
---
apiVersion: kubauth.kubotal.io/v1alpha1
kind: OidcClient
metadata:
  name: {{ .Values.clientName }}
  namespace: {{ .Values.oidcNamespace }}
spec:
  public: false
  secrets:
    - name: {{ $hashedSecretName }}
      key: hashedSecret
      hashed: true
  displayName: {{ .Values.displayName | quote }}
  description: {{ .Values.description | quote }}
  forceOpenIdScope: true
  grantTypes:
    - authorization_code
    - refresh_token
  responseTypes:
    - code
  scopes:
    {{- range .Values.scopes }}
    - {{ . | quote }}
    {{- end }}
  redirectURIs:
    {{- range .Values.redirectURIs }}
    - {{ . | quote }}
    {{- end }}
